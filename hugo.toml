baseURL = 'https://worldcorner.xyz/'
languageCode = 'zh-cn'
title = '世界一隅'
theme = 'PaperMod'
enableRobotsTXT = true

# 多语言：中文为默认（根路径），英文挂 /en/（PaperMod 自带 zh/en 主题文案与右上切换器）
defaultContentLanguage = 'zh'

[markup.goldmark.renderer]
  unsafe = true

