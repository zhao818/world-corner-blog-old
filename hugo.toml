# ---- 双语言定义 ----
[languages]
  [languages.zh]
    languageName = '中文'
    languageCode = 'zh-cn'
    weight = 1
    title = '世界一隅'
    [languages.zh.params]
      description = '在算法洪流中，守护清醒的微光。'
      DateFormat = '2006年1月2日'

  [languages.en]
    languageName = 'English'
    languageCode = 'en-us'
    weight = 2
    title = 'World Corner'
    [languages.en.params]
      description = 'Guarding a flicker of clarity in the flood of algorithms.'
      DateFormat = 'Jan 2, 2006'
      [languages.en.params.label]
        text = 'World Corner'

  # 英文菜单：已译板块指向 /en/，未译板块（听书/小程序/资产/技能）先指向中文页
