{{- define "main" }}
{{- $items := site.Data.skills }}
<div class="cat-scope">
  <h1 class="cat-title">🛠 技能总表</h1>
  <p class="cat-meta">Claude Code / GitHub App / 项目内技能清单 · 共 {{ len $items }} 项</p>
  <div class="cat-filters">
    <input id="cat-q" type="search" placeholder="搜索技能名或用途…" autocomplete="off">
    <select id="cat-g">
      <option value="all">全部分组</option>
      <option value="claude">Claude 全局技能</option><option value="githubapp">GitHub App 捆绑技能</option><option value="project">项目内技能</option>
    </select>
  </div>
  <p class="cat-count" id="cat-count">共 {{ len $items }} 项</p>
  <div class="cat-cards" id="cat-cards">
    {{- range $items }}
    <div class="cat-card" data-g="{{ .g }}" data-s="{{ printf "%s %s %s" .n .d .gn }}">
      <div class="cat-nm">
        <code>{{ .n }}</code>
        <span class="cat-tag">{{ .gn }}</span>
      </div>
      {{- with .d }}<p class="cat-ds">{{ . }}</p>{{- end }}
    </div>
    {{- end }}
  </div>
</div>

<style>
  .cat-scope { max-width: 980px; margin: 0 auto; }
  .cat-title { font-size: 24px; letter-spacing: 1px; color: #c9a55c; }
  .cat-meta { font-size: 13px; color: var(--secondary); margin: 8px 0 20px; }
  .cat-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .cat-filters input, .cat-filters select {
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--theme); color: var(--primary); font-size: 13px; outline: none;
  }
  .cat-filters input { flex: 1; min-width: 220px; }
  .cat-filters input:focus, .cat-filters select:focus { border-color: #c9a55c; }
  .cat-count { font-size: 12px; color: var(--secondary); margin-bottom: 12px; }
  .cat-cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .cat-card { background: var(--entry); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .cat-card:hover { border-color: #c9a55c; }
  .cat-nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cat-nm code { font-family: Consolas, monospace; font-size: 14px; color: #c9a55c; background: none; padding: 0; }
  .cat-tag { font-size: 10px; color: var(--secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
  .cat-ds { font-size: 13px; color: var(--secondary); line-height: 1.7; margin-top: 6px; }
</style>

<script>
(function () {
  var q = document.getElementById('cat-q');
  var g = document.getElementById('cat-g');
  var cards = [].slice.call(document.querySelectorAll('.cat-card'));
  var countEl = document.getElementById('cat-count');
  function apply() {
    var qq = (q.value || '').trim().toLowerCase();
    var gv = g.value, shown = 0;
    cards.forEach(function (el) {
      var ok = true;
      if (gv !== 'all' && el.getAttribute('data-g') !== gv) ok = false;
      if (qq && el.getAttribute('data-s').toLowerCase().indexOf(qq) < 0) ok = false;
      el.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    countEl.textContent = '共 ' + shown + ' 项';
  }
  [q, g].forEach(function (el) {
    el.addEventListener('input', apply);
    el.addEventListener('change', apply);
  });
  apply();
})();
</script>
{{- end }}
