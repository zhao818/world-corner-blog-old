<script>
(function () {
  function init() {
    var content = document.querySelector('.post-content') || document.querySelector('.pitfall-single');
    if (!content) return;
    var titleEl = document.querySelector('.post-title') || content.querySelector('h1');
    var lang = (document.documentElement.getAttribute('lang') || 'zh').slice(0, 2);
    var target = lang === 'en' ? 'zh' : 'en';
    var S = {
      btn: "🌐 AI Translate",
      back: "↩ Show original",
      loading: "AI translating… long articles take about a minute",
      done: "AI translation (machine translated, for reference · powered by worldcorner API)",
      fail: "Translation failed, please try again later"
    };
    var API = 'https://api.worldcorner.xyz/community/api/translate';
    var btn = document.createElement('button');
    btn.className = 'ai-tr-btn';
    btn.type = 'button';
    btn.textContent = S.btn;
    document.body.appendChild(btn);

    var panel = document.createElement('div');
    panel.className = 'ai-tr-panel';
    panel.hidden = true;
    if (content.parentNode) content.parentNode.insertBefore(panel, content.nextSibling);

    var state = 'orig';
    var cache = null;

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function toHtml(t) {
      return t.split(/\n\n+/).map(function (p) { return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>'; }).join('');
    }
    function call(text) {
      return fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, target: target })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.error) throw new Error(j.error);
        return j.translated;
      });
    }
    function withRetry(fn, n) {
      var p = fn();
      for (var i = 0; i < (n || 1); i++) {
        p = p.catch(function () { return new Promise(function (res) { setTimeout(res, 1500); }).then(fn); });
      }
      return p;
    }
    

    function splitClient(text, max) {
      var paras = text.split(/\n\n+/);
      var chunks = [];
      var buf = '';
      for (var i = 0; i < paras.length; i++) {
        var p = paras[i].trim();
        if (!p) continue;
        if (p.length > max) {
          if (buf) { chunks.push(buf); buf = ''; }
          for (var j = 0; j < p.length; j += max) chunks.push(p.slice(j, j + max));
          continue;
        }
        if (buf && (buf + '\n\n' + p).length > max) { chunks.push(buf); buf = p; }
        else buf = buf ? buf + '\n\n' + p : p;
      }
      if (buf) chunks.push(buf);
      return chunks;
    }
    function fetchAll() {
      if (cache) {
        panel.innerHTML = (cache.title ? '<h1 class="ai-tr-title"></h1>' : '') + toHtml(cache.body);
        if (cache.title) panel.querySelector('.ai-tr-title').textContent = cache.title;
        var doneNote = document.createElement('p');
        doneNote.className = 'ai-tr-note';
        doneNote.textContent = S.done;
        panel.appendChild(doneNote);
        return Promise.resolve(cache);
      }
      var titleText = titleEl ? titleEl.innerText.trim() : '';
      var chunks = splitClient(content.innerText.trim(), 650);
      var results = new Array(chunks.length);
      var done = 0;
      var head = titleText ? '<h1 class="ai-tr-title"></h1>' : '';
      var note = document.createElement('p');
      note.className = 'ai-tr-note';
      function render() {
        var html = head;
        for (var i = 0; i < results.length; i++) if (results[i]) html += toHtml(results[i]);
        panel.innerHTML = html;
        note.textContent = done < chunks.length ? done + '/' + chunks.length + ' · ' + S.loading : S.done;
        panel.appendChild(note);
      }
      if (titleText) {
        withRetry(function () { return call(titleText); }, 1).then(function (t) {
          if (state === 'trans') { var h1 = panel.querySelector('.ai-tr-title'); if (h1) h1.textContent = t; }
        }).catch(function () {});
      }
      var idx = 0;
      function lane() {
        return new Promise(function (resolve) {
          function next() {
            if (idx >= chunks.length) return resolve();
            var i = idx++;
            withRetry(function () { return call(chunks[i]); }, 2).then(function (t) {
              results[i] = t; done++; render(); next();
            }).catch(function () {
              results[i] = '⚠ ' + S.fail; done++; render(); next();
            });
          }
          next();
        });
      }
      render();
      return Promise.all([lane(), lane()]).then(function () {
        cache = { title: titleText, body: results.join('\n\n') };
        return cache;
      });
    }
    btn.addEventListener('click', function () {
      if (state === 'trans') {
        state = 'orig';
        panel.hidden = true;
        content.style.display = '';
        if (titleEl) titleEl.style.display = '';
        btn.textContent = S.btn;
        return;
      }
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = S.loading;
      if (state === 'orig') {
        panel.hidden = false;
        content.style.display = 'none';
        if (titleEl) titleEl.style.display = 'none';
        state = 'trans';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      fetchAll().then(function () {
        state = 'trans';
        btn.disabled = false;
        btn.textContent = S.back;
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = S.btn;
        panel.innerHTML = '<p class="ai-tr-note">' + esc(S.fail) + '</p>';
        panel.hidden = false;
        state = 'orig';
      });
    });

    var css = document.createElement('style');
    css.textContent = [
      '.ai-tr-btn{position:fixed;right:18px;bottom:18px;z-index:99;padding:9px 14px;border-radius:999px;',
      'border:1px solid var(--secondary,#999);background:var(--theme,#fafafa);color:var(--primary,#111);',
      'font-size:14px;cursor:pointer;opacity:.92;box-shadow:0 2px 10px rgba(0,0,0,.15);}',
      '.ai-tr-btn:hover{opacity:1}',
      '.ai-tr-btn:disabled{cursor:wait;opacity:.7}',
      '.ai-tr-panel{border:1px dashed var(--secondary,#bbb);border-radius:8px;padding:18px 22px;margin:24px 0;line-height:1.8}',
      '.ai-tr-panel[hidden]{display:none}',
      '.ai-tr-note{font-size:12px;color:var(--secondary,#888);margin:0 0 12px}',
      '.ai-tr-title{font-size:1.4em;margin:0 0 16px}'
    ].join('');
    document.head.appendChild(css);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script>
    let menu = document.getElementById('menu')

        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
